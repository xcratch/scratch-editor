<!doctype html><html><head><script>if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./service-worker.js').then(function (registration) {
            console.log('PWA worker registration successful', registration.scope);
          }, function (err) {
            console.log('PWA worker registration failed', err);
          }).catch(function (err) {
            console.log(err);
          });
        });

        // 新しい Service Worker がアクティブになりページ制御を開始したときにリロードする
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      } else {
        console.log('Service Worker is not supported by browser.');
      }</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" value="notranslate"><link rel="shortcut icon" href="static/favicon.ico"><title>Scratch 3.0 GUI: Compatibility Testing</title><script defer="defer" src="compatibilitytesting.js"></script><meta name="apple-mobile-web-app-title" content="Xcratch" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-status-bar-style" content="default" /><link rel="manifest" href="./manifest.1342cc93635d706966c1d194266dc49f.json" crossorigin="use-credentials" /></head><body></body></html>
